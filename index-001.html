}

function catTagsP(p,compact){if(!p||!p.catIds)return'';return p.catIds.map(cid=>{const c=catById(cid);if(!c)return'';const ci=c.id%CAT_COLORS.length;return'<span class="ctag" style="background:'+CAT_COLORS[ci]+'18;color:'+CAT_COLORS[ci]+';border:1px solid '+CAT_COLORS[ci]+'30">'+c.icon+(compact?'':' '+c.code)+'</span>';}).join('');}
function toast(m,t='inf'){const c=document.getElementById('tc');const ic={ok:'<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',er:'<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',inf:'<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'};const el=document.createElement('div');el.className='toast '+t;el.innerHTML=(ic[t]||ic.inf)+'<span>'+m+'</span>';c.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(30px)';el.style.transition='.3s';setTimeout(()=>el.remove(),300);},3000);}
function genSku(catIds,excludeId){const codes=(catIds||[]).map(id=>(DB.cats.find(c=>c.id===id)||{}).code).filter(Boolean).map(c=>c.toUpperCase()).sort();const prefix=codes.length?codes.join('-'):'GEN';const fp=prefix+'-';let mx=0;DB.prods.forEach(p=>{if(p.id===excludeId)return;if(p.sku&&p.sku.startsWith(fp)){const n=parseInt(p.sku.substring(fp.length));if(!isNaN(n)&&n>mx)mx=n;}});return fp+String(mx+1).padStart(3,'0');}
function genOrdNo(){const d=new Date();const ds=String(d.getFullYear())+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');const cnt=DB.ords.filter(o=>o.no&&o.no.includes(ds)).length+1;return'ORD-'+ds+'-'+String(cnt).padStart(3,'0');}

ss="pnT">最近操作</span></div><div class="pnB">'+ah+'</div></div><div class="pnl"><div class="pnH"><span class="pnT">低库存预警</span><span style="font-size:.62rem;color:var(--dg);font-family:DM Mono,monospace">'+lhi.length+'项</span></div><div class="pnB">'+lhh+'</div></div></div>';}

let sF='name',sD=1,fCat='all',iPg=1;const PG=8;
function rInv(){const mx=Math.max(...DB.prods.map(p=>p.stock),1);let ch='<span class="fc '+(fCat==='all'?'on':'')+'" onclick="fCat=\'all\';iPg=1;render(\'inv\')">全部</span>';DB.cats.sort((a,b)=>a.order-b.order).forEach(c=>{ch+='<span class="fc '+(fCat===''+c.id?'on':'')+'" onclick="fCat=\''+c.id+'\';iPg=1;render(\'inv\')">'+c.icon+' '+esc(c.name)+'<span class="fcc">'+c.code+'</span></span>';});let fl=[...DB.prods];const q=(document.getElementById('iS')?.value||'').toLowerCase().trim();if(q)fl=fl.filter(p=>p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)||(p.catIds||[]).some(cid=>{const c=catById(cid);return c&&(c.name.toLowerCase().includes(q)||c.code.toLowerCase().includes(q));}));if(fCat!=='all')fl=fl.filter(p=>(p.catIds||[]).includes(Number(fCat)));fl.sort((a,b)=>{let va=a[sF],vb=b[sF];if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase();}return va<vb?-sD:va>vb?sD:0;});const total=fl.length,tp=Math.max(1,Math.ceil(total/PG));if(iPg>tp)iPg=tp;const st=(iPg-1)*PG,items=fl.slice(st,st+PG);let tb='';if(!items.length){tb='<tr><td colspan="7"><div class="empty"><p>没有匹配商品</p></div></td></tr>';}else{tb=items.map(p=>{const pct=(p.stock/mx)*100,lv=p.stock===0?'lo':p.stock<=10?'md':'hi';let ac='';if(has('editProduct'))ac+='<button class="bi" title="编辑" onclick="openEditP('+p.id+')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>';if(has('deleteProduct'))ac+='<button class="bi" title="删除" onclick="delP('+p.id+')" style="color:var(--dg)"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>';const sc=has('viewCost');return'<tr><td><strong>'+esc(p.name)+'</strong>'+(p.note?'<br><span style="font-size:.62rem;color:var(--t3)">'+esc(p.note)+'</span>':'')+'</td><td><span class="sk">'+esc(p.sku)+'</span></td><td><div class="ctags">'+catTagsP(p)+'</div></td><td><span style="font-size:.68rem;color:var(--t3);font-family:DM Mono,monospace">'+esc(p.loc||'-')+'</span></td><td><div class="si2"><span class="sn" style="color:var(--'+(lv==='lo'?'dg':lv==='md'?'wa':'sf')+')">'+p.stock+'</span><div class="sbr2"><div class="sbf2 '+lv+'" style="width:'+pct+'%"></div></div></div></td><td><span style="font-family:DM Mono,monospace">¥'+p.price.toLocaleString()+'</span>'+(sc?'<br><span style="font-size:.58rem;color:var(--dg);font-family:DM Mono,monospace">成本¥'+p.cost+'</span>':'')+'</td><td><div class="ac">'+(ac||'<span style="color:var(--t3);font-size:.65rem">只读</span>')+'</div></td></tr>';}).join('');}let pg='';for(let i=1;i<=tp;i++)pg+='<button class="pg '+(i===iPg?'on':'')+'" onclick="iPg='+i+';render(\'inv\')">'+i+'</button>';return'<div class="tb"><div class="sbox"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" id="iS" placeholder="搜索名称/SKU/分类编号..." oninput="iPg=1;render(\'inv\')" /></div><div class="fch">'+ch+'</div><span class="tbsp"></span>'+(has('addProduct')?'<button class="btn bp bs aw" onclick="openAddP()"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 新增</button>':'')+'</div><div class="tw"><div class="ts"><table><thead><tr><th onclick="sB(\'name\')">名称↕</th><th onclick="sB(\'sku\')">SKU↕</th><th>分类</th><th>位置</th><th onclick="sB(\'stock\')">库存↕</th><th onclick="sB(\'price\')">价格↕</th><th>操作</th></tr></thead><tbody>'+tb+'</tbody></table></div><div class="tf"><span>共'+total+'件 · '+iPg+'/'+tp+'</span><div class="pag">'+pg+'</div></div></div>';}

async function saveProd(){
  const id=document.getElementById('pmId').value;const name=document.getElementById('pmN').value.trim();if(!name){toast('请输入商品名称','er');return;}if(!pmCats.length){toast('请至少选择一个分类','er');return;}
  const sku=pmSkuManual?(document.getElementById('skuAuto').value||genSku(pmCats,parseInt(id)||null)):genSku(pmCats,parseInt(id)||null);
  const stock=parseInt(document.getElementById('pmS').value)||0,price=parseFloat(document.getElementById('pmP').value)||0,cost=parseFloat(document.getElementById('pmC').value)||0;
  const loc=document.getElementById('pmL').value.trim(),note=document.getElementById('pmNt').value.trim();
  const row={name,sku,sku_manual:pmSkuManual,stock,price,cost,location:loc,note};
  try{
    if(id){
      const{error}=await sb.from('products').update(row).eq('id',id);if(error)throw error;
      await sb.from('product_categories').delete().eq('product_id',id);
      if(pmCats.length){await sb.from('product_categories').insert(pmCats.map(cid=>({product_id:Number(id),category_id:cid})));}

h><th>创建时间</th><th>创建人</th><th>操作</th></tr></thead><tbody>'+tb+'</tbody></table></div></div>';}

async function updOrd(id,st){const o=DB.ords.find(x=>x.id===id);if(!o)return;try{await sb.from('orders').update({status:st,processed_by:user.u}).eq('id',id);if(st==='done'){for(const item of o.items){await sb.rpc('decrement_stock',{pid:item.pid,amount:item.qty});}}await loadAllData();toast('订单→'+OSTAT[st].l,'ok');render(curP);}catch(err){toast('操作失败: '+err.message,'er');}}

function viewOrd(id){const o=DB.ords.find(x=>x.id===id);if(!o)return;const sc=OSTAT[o.st]||{},pk=PICKUPS[o.pk]||{};const its=o.items.map(i=>{const p=prodById(i.pid);return'<tr><td>'+(p?esc(p.name):'已删除')+'</td><td><span class="sk">'+(p?esc(p.sku):'-')+'</span></td><td><div class="ctags">'+(p?catTagsP(p,true):'')+'</div></td><td>'+(p?p.loc:'-')+'</td><td style="font-weight:500">'+i.qty+'</td><td>'+(p?'¥'+p.price.toLocaleString():'-')+'</td><td style="font-weight:500">'+(p?'¥'+(p.price*i.qty).toLocaleString():'-')+'</td></tr>';}).join('');document.getElementById('odT').textContent='订单 '+esc(o.no);document.getElementById('odB').innerHTML='<div class="odS"><div class="odL">基本信息</div><div class="odG"><div class="odI"><div class="odV"><span class="badge '+sc.c+'">'+sc.l+'</span></div><div class="odK">状态</div></div><div class="odI"><div class="odV">'+(pk.i||'')+' '+esc(pk.l||o.pk)+'</div><div class="odK">取货方式</div></div><div class="odI"><div class="odV">'+esc(o.by)+'</div><div class="odK">创建人</div></div><div class="odI"><div class="odV">'+esc(o.pb||'-')+'</div><div class="odK">处理人</div></div><div class="odI"><div class="odV">'+esc(o.cr)+'</div><div class="odK">创建时间</div></div></div></div>'+(o.note?'<div class="odS"><div class="odL">备注</div><div style="font-size:.82rem;color:var(--t2)">'+esc(o.note)+'</div></div>':'')+'<div class="odS"><div class="odL">商品明细</div><div class="tw"><table><thead><tr><th>商品</th><th>SKU</th><th>分类</th><th>位置</th><th>数量</th><th>单价</th><th>小计</th></tr></thead><tbody>'+its+'</tbody></table></div></div>';let ft='<button class="btn bg bs" onclick="cMo(\'odmo\')">关闭</button>';if(o.st==='picking')ft+='<button class="btn bp bs aw" onclick="printOrd('+o.id+')">🖨️ 打印</button>';if(o.st==='pending'&&has('processOrder'))ft+='<button class="btn bp bs aw" onclick="updOrd('+o.id+',\'picking\');cMo(\'odmo\')">开始拣货</button>';if(o.st==='picking'&&has('processOrder'))ft+='<button class="btn bp bs aw" onclick="updOrd('+o.id+',\'done\');cMo(\'odmo\')">完成拣货</button>';document.getElementById('odF').innerHTML=ft;oMo('odmo');}

function printOrd(id){const o=DB.ords.find(x=>x.id===id);if(!o)return;const pk=PICKUPS[o.pk]||{};const its=o.items.map(i=>{const p=prodById(i.pid);const cats=(p?p.catIds:[]).map(cid=>{const c=catById(cid);return c?c.name:''}).filter(Boolean).join(', ');return'<tr><td>'+(p?p.name:'已删除')+'</td><td>'+(p?p.sku:'-')+'</td><td>'+cats+'</td><td>'+(p?p.loc:'-')+'</td><td><strong>'+i.qty+'</strong></td></tr>';}).join('');document.getElementById('pa').innerHTML='<h2>📦 订单拣货单</h2><div style="font-size:14px;color:#666;margin-bottom:10px">'+esc(o.no)+'</div><div class="pm"><div><strong>取货方式</strong>'+(pk.i||'')+' '+esc(pk.l||o.pk)+'</div><div><strong>创建时间</strong>'+esc(o.cr)+'</div><div><strong>创建人</strong>'+esc(o.by)+'</div><div><strong>处理人</strong>'+esc(o.pb||user.u)+'</div></div>'+(o.note?'<div style="margin:8px 0;font-size:13px"><strong>备注:</strong> '+esc(o.note)+'</div>':'')+'<table><thead><tr><th>商品</th><th>SKU</th><th>分类</th><th>存放位置</th><th>数量</th></tr></thead><tbody>'+its+'</tbody></table><div style="margin-top:30px;font-size:12px;color:#999">打印时间: '+nowS()+' · CloudStock</div>';window.print();}

// ═══════════════════════════════════════════════
// SALES — WORKSPACE
// ═══════════════════════════════════════════════
function rSW(){const P=DB.prods,pend=DB.ords.filter(o=>o.by===user.u&&o.st==='pending').length,pick=DB.ords.filter(o=>o.by===user.u&&o.st==='picking').length;const rec=[...DB.ords].filter(o=>o.by===user.u).sort((a,b)=>b.cr.localeCompare(a.cr)).slice(0,5);const rh=rec.length?rec.map(o=>{const sc=OSTAT[o.st]||{},pk=PICKUPS[o.pk]||{};const its=o.items.map(i=>{const p=prodById(i.pid);return p?p.name:'已删除'}).join(', ');return'<div class="ai"><div class="ad ord"></div><div class="at"><p><strong>'+esc(o.no)+'</strong> · '+esc(its)+'</p><span style="font-size:.62rem;color:var(--t3)">'+(pk.i||'')+' '+esc(pk.l||'')+' · <span class="badge '+sc.c+'">'+sc.l+'</span></span></div><span class="atm">'+esc(o.cr)+'</span></div>';}).join(''):'<div class="empty"><p>暂无订单</p></div>';return'<div class="stats"><div class="sc"><div class="sl">在售商品</div><div class="sv">'+P.length+'</div><div class="sch up">种</div></div><div class="sc"><div class="sl">总库存</div><div class="sv">'+P.reduce((s,p)=>s+p.stock,0).toLocaleString()+'</div><div class="sch up">件</div></div><div class="sc"><div class="sl">待处理</div><div class="sv" style="color:'+(pend?'var(--wa)':'var(--sf)')+'">'+pend+'</div></div><div class="sc"><div class="sl">拣货中</div><div class="sv" style="color:'+(pick?'var(--in)':'var(--sf)')+'">'+pick+'</div></div></div><div class="qg"><div class="qc" onclick="goPage(\'sNewOrd\')"><div class="qi">📝</div><div class="qn">新建订单</div><div class="qd">搜索商品 · 上传图片 · 选择取货方式</div></div><div class="qc" onclick="goPage(\'sOrds\')"><div class="qi">📋</div><div class="qn">订单列表</div><div class="qd">查看所有订单及状态</div></div><div class="qc" onclick="goPage(\'sProds\')"><div class="qi">🔍</div><div class="qn">商品查询</div><div class="qd">搜索商品查看库存</div></div></div><div class="pnl"><div class="pnH"><span class="pnT">我的最近订单</span></div><div class="pnB">'+rh+'</div></div>';}

// ═══════════════════════════════════════════════
// SALES — NEW ORDER — async, Supabase
// ═══════════════════════════════════════════════
let dItems=[],dPk='',dOI='',dBI='',dNote='',dEditId=null;
function rNewOrd(){return'<div style="display:flex;align-items:center;gap:.6rem;margin-bottom:1rem"><h3 style="font-family:Syne,sans-serif;font-weight:600;font-size:1rem">创建销售订单</h3><span class="badge b-dr" id="drBadge" style="display:none">草稿</span></div><div style="background:var(--s1);border:1px solid var(--bd);border-radius:var(--rl);padding:1.2rem;margin-bottom:1rem"><div style="font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);font-family:DM Mono,monospace;margin-bottom:.6rem;font-weight:500">选择商品 *</div><div class="sbox" style="width:100%"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" id="ordS" placeholder="输入商品名称、SKU或分类编号搜索..." oninput="ordSearch()" /></div><div id="ordSR"></div><div id="ordItems"></div></div><div style="background:var(--s1);border:1px solid var(--bd);border-radius:var(--rl);padding:1.2rem;margin-bottom:1rem"><div style="font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);font-family:DM Mono,monospace;margin-bottom:.6rem;font-weight:500">取货方式 *</div><div class="pkg">'+Object.entries(PICKUPS).map(([k,v])=>'<div class="pk" data-pk="'+k+'" onclick="selPk(\''+k+'\')"><div class="pkI">'+v.i+'</div><div class="pkN">'+v.l+'</div><div class="pkD">'+v.d+'</div></div>').join('')+'</div></div><div style="background:var(--s1);border:1px solid var(--bd);border-radius:var(--rl);padding:1.2rem;margin-bottom:1rem"><div style="font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);font-family:DM Mono,monospace;margin-bottom:.6rem;font-weight:500">附件</div><div class="fr"><div class="fgm"><label>订单图片</label><div class="iu"><div class="ib" id="oIB" onclick="document.getElementById(\'oII\').click()"><span class="ia">+</span><input type="file" id="oII" accept="image/*" onchange="hImg(this,\'oIB\',\'dOI\')" /></div></div></div><div class="fgm"><label>账单图片</label><div class="iu"><div class="ib" id="bIB" onclick="document.getElementById(\'bII\').click()"><span class="ia">+</span><input type="file" id="bII" accept="image/*" onchange="hImg(this,\'bIB\',\'dBI\')" /></div></div></div></div></div><div style="background:var(--s1);border:1px solid var(--bd);border-radius:var(--rl);padding:1.2rem;margin-bottom:1.2rem"><div class="fgm"><label>备注</label><textarea id="ordN" placeholder="备注信息..." oninput="dNote=this.value">'+esc(dNote)+'</textarea></div></div><div style="display:flex;gap:.5rem;justify-content:flex-end"><button class="btn bg" onclick="saveDraft()">💾 保存草稿</button><button class="btn bp aw" onclick="submitOrd()">✓ 提交订单</button></div>';}
function initNO(){renderOrdItems();renderOrdPics();if(dPk)document.querySelectorAll('.pk').forEach(el=>el.classList.toggle('on',el.dataset.pk===dPk));if(dEditId)document.getElementById('drBadge').style.display='';}
function ordSearch(){const q=(document.getElementById('ordS')?.value||'').toLowerCase().trim(),el=document.getElementById('ordSR');if(!q){el.innerHTML='';return;}const rs=DB.prods.filter(p=>p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)||(p.catIds||[]).some(cid=>{const c=catById(cid);return c&&(c.name.toLowerCase().includes(q)||c.code.toLowerCase().includes(q));})).slice(0,8);if(!rs.length){el.innerHTML='<div class="srl"><div style="padding:.8rem;text-align:center;color:var(--t3);font-size:.78rem">未找到匹配商品</div></div>';return;}el.innerHTML='<div class="srl">'+rs.map(p=>{const ic=dItems.find(i=>i.pid===p.id);const sc=p.stock===0?'var(--dg)':p.stock<=10?'var(--wa)':'var(--sf)';const icon=(catById((p.catIds||[])[0])||{icon:'📦'}).icon;return'<div class="sri" onclick="addOrdItem('+p.id+')"><span class="srI">'+icon+'</span><div style="flex:1;min-width:0"><div class="srN">'+esc(p.name)+'</div><div class="srD">'+esc(p.sku)+' · <span class="ctags">'+catTagsP(p,true)+'</span> · ¥'+p.price.toLocaleString()+'</div></div><span class="srS" style="color:'+sc+'">'+(p.stock===0?'缺货':p.stock<=10?'仅剩'+p.stock:'库存'+p.stock)+'</span>'+(ic?'<span style="font-size:.6rem;color:var(--ac);font-family:DM Mono,monospace">已选×'+ic.qty+'</span>':'')+'</div>';}).join('')+'</div>';}
function addOrdItem(pid){const ex=dItems.find(i=>i.pid===pid);if(ex)ex.qty++;else dItems.push({pid,qty:1});renderOrdItems();document.getElementById('ordS').value='';document.getElementById('ordSR').innerHTML='';}
function renderOrdItems(){const el=document.getElementById('ordItems');if(!el)return;if(!dItems.length){el.innerHTML='<div class="oi-empty">请在上方搜索并选择商品</div>';return;}el.innerHTML=dItems.map((it,idx)=>{const p=prodById(it.pid);if(!p)return'';const sc=p.stock===0?'var(--dg)':p.stock<=10?'var(--wa)':'var(--sf)';const icon=(catById((p.catIds||[])[0])||{icon:'📦'}).icon;return'<div class="oi-row"><span>'+icon+'</span><span class="oin">'+esc(p.name)+'</span><span class="oisk">'+esc(p.sku)+'</span><span class="oist" style="color:'+sc+'">库存:'+p.stock+'</span><input type="number" value="'+it.qty+'" min="1" onchange="updOQ('+idx+',this.value)" /><button class="oid" onclick="rmOI('+idx+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>';}).join('');}
function updOQ(i,v){if(dItems[i])dItems[i].qty=Math.max(1,parseInt(v)||1);}function rmOI(i){dItems.splice(i,1);renderOrdItems();}
function selPk(pk){dPk=pk;document.querySelectorAll('.pk').forEach(el=>el.classList.toggle('on',el.dataset.pk===pk));}
function hImg(inp,bid,vn){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=function(e){window[vn]=e.target.result;const b=document.getElementById(bid);b.innerHTML='<img src="'+e.target.result+'" /><span class="ir" onclick="event.stopPropagation();rmImg(\''+vn+'\',\''+bid+'\')">×</span>';};r.readAsDataURL(f);}
function rmImg(vn,bid){window[vn]='';const b=document.getElementById(bid);const inId=bid==='oIB'?'oII':'bII';b.innerHTML='<span class="ia">+</span><input type="file" id="'+inId+'" accept="image/*" onchange="hImg(this,\''+bid+'\',\''+vn+'\')" />';}
function renderOrdPics(){if(dOI){const b=document.getElementById('oIB');if(b)b.innerHTML='<img src="'+dOI+'" /><span class="ir" onclick="event.stopPropagation();rmImg(\'dOI\',\'oIB\')">×</span>';}if(dBI){const b=document.getElementById('bIB');if(b)b.innerHTML='<img src="'+dBI+'" /><span class="ir" onclick="event.stopPropagation();rmImg(\'dBI\',\'bIB\')">×</span>';}}

async function saveDraft(){if(!dItems.length&&!dPk){toast('请至少选择商品或取货方式','er');return;}try{const row={order_no:genOrdNo(),pickup_method:dPk||'motoboy',status:'draft',order_image:dOI,bill_image:dBI,note:dNote,created_by:user.u};let ordId;if(dEditId){await sb.from('orders').update(row).eq('id',dEditId);ordId=dEditId;await sb.from('order_items').delete().eq('order_id',dEditId);}else{const{data,error}=await sb.from('orders').insert(row).select().single();if(error)throw error;ordId=data.id;}if(dItems.length){await sb.from('order_items').insert(dItems.map(i=>({order_id:ordId,product_id:i.pid,qty:i.qty})));}await loadAllData();toast('已保存到草稿箱','ok');clearDraft();goPage('sOrds');}catch(err){toast('保存失败: '+err.message,'er');}}

async function submitOrd(){if(!dItems.length){toast('请至少选择一件商品','er');return;}if(!dPk){toast('请选择取货方式','er');return;}for(const it of dItems){const p=prodById(it.pid);if(!p){toast('有商品已不存在','er');return;}if(it.qty>p.stock){toast('「'+p.name+'」库存不足（当前'+p.stock+'）','er');return;}}try{const row={order_no:genOrdNo(),pickup_method:dPk,status:'pending',order_image:dOI,bill_image:dBI,note:dNote,created_by:user.u};let ordId;if(dEditId){await sb.from('orders').update(row).eq('id',dEditId);ordId=dEditId;await sb.from('order_items').delete().eq('order_id',dEditId);}else{const{data,error}=await sb.from('orders').insert(row).select().single();if(error)throw error;ordId=data.id;}if(dItems.length){await sb.from('order_items').insert(dItems.map(i=>({order_id:ordId,product_id:i.pid,qty:i.qty})));}await loadAllData();toast('订单已提交！','ok');clearDraft();goPage('sOrds');}catch(err){toast('提交失败: '+err.message,'er');}}
function clearDraft(){dItems=[];dPk='';dOI='';dBI='';dNote='';dEditId=null;}

// ═══════════════════════════════════════════════
// SALES — ORDER LIST
// ═══════════════════════════════════════════════
function rSOrds(){const ords=[...DB.ords].filter(o=>o.by===user.u).sort((a,b)=>b.cr.localeCompare(a.cr));let tb='';if(!ords.length){tb='<tr><td colspan="6"><div class="empty"><p>暂无订单</p></div></td></tr>';}else{tb=ords.map(o=>{const sc=OSTAT[o.st]||{},pk=PICKUPS[o.pk]||{};const its=o.items.map(i=>{const p=prodById(i.pid);return p?p.name+'×'+i.qty:'已删除'}).join(', ');let ac='<button class="bi" title="查看" onclick="viewOrd('+o.id+')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>';if(o.st==='draft'){ac+='<button class="bi" title="编辑" onclick="editDraft('+o.id+')" style="color:var(--ac)"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>';ac+='<button class="bi" title="删除" onclick="delOrd('+o.id+')" style="color:var(--dg)"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>';}return'<tr><td><strong>'+esc(o.no)+'</strong></td><td style="max-width:180px;white-space:normal;font-size:.72rem">'+esc(its)+'</td><td>'+(pk.i||'')+' '+esc(pk.l||o.pk)+'</td><td><span class="badge '+sc.c+'">'+sc.l+'</span></td><td style="font-family:DM Mono,monospace;font-size:.68rem;color:var(--t3)">'+esc(o.cr)+'</td><td><div class="ac">'+ac+'</div></td></tr>';}).join('');}return'<div class="tw"><div class="ts"><table><thead><tr><th>订单号</th><th>商品</th><th>取货</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>'+tb+'</tbody></table></div></div>';}
function editDraft(id){const o=DB.ords.find(x=>x.id===id);if(!o||o.st!=='draft')return;dEditId=o.id;dItems=o.items.map(i=>({...i}));dPk=o.pk;dOI=o.oi||'';dBI=o.bi||'';dNote=o.note||'';goPage('sNewOrd');}
async function delOrd(id){const o=DB.ords.find(x=>x.id===id);if(!o||o.st!=='draft')return;if(!confirm('确定删除草稿？'))return;try{await sb.from('orders').delete().eq('id',id);await loadAllData();toast('草稿已删除','inf');render('sOrds');}catch(err){toast('删除失败: '+err.message,'er');}}

// ═══════════════════════════════════════════════
// SALES — PRODUCT QUERY
// ═══════════════════════════════════════════════
function rSProds(){return'<div class="tb"><div class="sbox" style="width:100%"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" id="spS" placeholder="输入商品名称、SKU或分类编号搜索..." oninput="doSPSearch()" autofocus /></div></div><div id="spR"><div class="empty"><svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>搜索商品查看价格和库存状态</p></div></div>';}
function doSPSearch(){const q=(document.getElementById('spS')?.value||'').toLowerCase().trim(),el=document.getElementById('spR');if(!q){el.innerHTML='<div class="empty"><p>搜索商品</p></div>';return;}const rs=DB.prods.filter(p=>p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)||(p.catIds||[]).some(cid=>{const c=catById(cid);return c&&(c.name.toLowerCase().includes(q)||c.code.toLowerCase().includes(q));}));if(!rs.length){el.innerHTML='<div class="empty"><p>未找到匹配商品</p></div>';return;}el.innerHTML=rs.map(p=>{const sc=p.stock===0?'var(--dg)':p.stock<=10?'var(--wa)':'var(--sf)';const st=p.stock===0?'<span style="color:var(--dg);font-weight:600">缺货</span>':p.stock<=10?'<span style="color:var(--wa)">仅剩'+p.stock+'</span>':'<span style="color:var(--sf)">有货('+p.stock+')</span>';const icon=(catById((p.catIds||[])[0])||{icon:'📦'}).icon;return'<div class="pnl" style="margin-bottom:.5rem"><div class="pnB" style="display:flex;align-items:center;gap:.8rem"><div style="width:42px;height:42px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:1.3rem;background:var(--s2);border:1px solid var(--bd);flex-shrink:0">'+icon+'</div><div style="flex:1;min-width:0"><div style="font-weight:500;margin-bottom:.1rem">'+esc(p.name)+'</div><div style="font-size:.68rem;color:var(--t3);font-family:DM Mono,monospace">'+esc(p.sku)+' · <span class="ctags">'+catTagsP(p,true)+'</span></div>'+(p.note?'<div style="font-size:.68rem;color:var(--t3)">'+esc(p.note)+'</div>':'')+'</div><div style="text-align:right;flex-shrink:0"><div style="font-family:DM Mono,monospace;font-weight:600;font-size:1rem">¥'+p.price.toLocaleString()+'</div><div style="font-size:.72rem">'+st+'</div></div></div></div>';}).join('');}

// GLOBAL SEARCH
function gSearch(q){if(user?.r==='sales'){if(curP!=='sProds')goPage('sProds');setTimeout(()=>{const e=document.getElementById('spS');if(e){e.value=q;doSPSearch();}},50);}else{if(curP!=='inv')goPage('inv');setTimeout(()=>{const e=document.getElementById('iS');if(e){e.value=q;iPg=1;render('inv');}},50);}}
</script>
